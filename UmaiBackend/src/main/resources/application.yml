spring:
  application:
    name: umai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/umai}
    username: ${DB_USERNAME:umai}
    password: ${DB_PASSWORD:umai}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Real OSM data is in V4. Fictional samples require the explicit dev profile.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    # A database previously used in dev can omit its applied repeatable sample
    # script in prod. Versioned migrations still require full validation.
    ignore-migration-patterns: '*:future,repeatable:missing'

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  error:
    # Never leak stack traces or internal messages to API clients.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

umai:
  data:
    include-seed: ${UMAI_INCLUDE_SEED:false}
  refresh:
    enabled: ${UMAI_REFRESH_ENABLED:true}
    cron: ${UMAI_REFRESH_CRON:0 0 4 * * MON}
    min-lat: ${UMAI_REFRESH_MIN_LAT:35.50}
    min-lon: ${UMAI_REFRESH_MIN_LON:139.50}
    max-lat: ${UMAI_REFRESH_MAX_LAT:35.90}
    max-lon: ${UMAI_REFRESH_MAX_LON:139.95}
    grid-size: 4
    max-requests: ${UMAI_REFRESH_MAX_REQUESTS:64}
    pause: 2s
  cors:
    # Comma-separated list of origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Login/registration attempts per period, per client address.
    auth-attempts: ${RATE_LIMIT_AUTH_ATTEMPTS:10}
    # Other write requests (reviews, submissions) per period.
    write-requests: ${RATE_LIMIT_WRITE_REQUESTS:60}
    photo-requests: ${RATE_LIMIT_PHOTO_REQUESTS:10}
    period: ${RATE_LIMIT_PERIOD:1m}

  security:
    # Comma-separated emails promoted to ADMIN at startup. The accounts must already
    # be registered; this never creates users or sets passwords.
    admin-emails: ${UMAI_ADMIN_EMAILS:}

    jwt:
      # No default: a committed signing key would be public. Startup fails without it.
      # Generate one with: openssl rand -base64 48
      secret: ${JWT_SECRET:}
      expires-in: ${JWT_EXPIRES_IN:12h}

  overpass:
    # Only contacted by an explicit admin-triggered import, never during browsing.
    endpoint: ${OVERPASS_ENDPOINT:https://overpass-api.de/api/interpreter}
    timeout: ${OVERPASS_TIMEOUT:90s}
    user-agent: ${OVERPASS_USER_AGENT:Umai/1.0 (Tokyo vegetarian restaurant finder)}
    max-elements: ${OVERPASS_MAX_ELEMENTS:500}

  foursquare:
    # Real restaurant photos, backfilled by an admin action. Disabled until an API key
    # is set — the app runs fine without it and shows the generated fallback cover.
    api-key: ${FOURSQUARE_API_KEY:}
    endpoint: ${FOURSQUARE_ENDPOINT:https://api.foursquare.com/v3}
    match-radius-meters: ${FOURSQUARE_MATCH_RADIUS:150}
    timeout: ${FOURSQUARE_TIMEOUT:10s}

  google:
    cost:
      daily-requests: ${GOOGLE_DAILY_REQUESTS:100}
      monthly-requests: ${GOOGLE_MONTHLY_REQUESTS:1000}
      photos-enabled: ${GOOGLE_PHOTOS_ENABLED:true}
    # Optional place identifier matching and visitor-requested live photos.
    # Descriptive Google content is not stored in restaurant records.
    api-key: ${GOOGLE_MAPS_API_KEY:}
    endpoint: ${GOOGLE_PLACES_ENDPOINT:https://places.googleapis.com/v1}
    match-radius-meters: ${GOOGLE_MATCH_RADIUS:120}
    photo-max-width: ${GOOGLE_PHOTO_MAX_WIDTH:800}
    timeout: ${GOOGLE_TIMEOUT:10s}
    # Run the full enrichment once on startup (no admin/token needed). Handy for a
    # local one-off; leave false in any real deployment and use the admin endpoint.
    enrich-on-start: ${UMAI_GOOGLE_ENRICH_ON_START:false}

  submissions:
    # Hold submissions for the existing moderation queue by default.
    auto-publish: ${SUBMISSIONS_AUTO_PUBLISH:false}

logging:
  level:
    com.umai.backend: ${LOG_LEVEL:INFO}
